<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="جیب">
<meta name="theme-color" content="#0a0a12">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<title>جیب</title>
<style>
:root{--bg:#0a0a12;--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.09);--line:rgba(255,255,255,.08);--text:#f4f2ff;--mute:#9b98b3;--a1:#8b5cf6;--a2:#ec4899;--good:#34d399;--bad:#fb7185;--r:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:Vazirmatn,-apple-system,Tahoma,sans-serif;font-feature-settings:"ss01";-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{min-height:100vh;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 96px)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 40% at 85% 0%,rgba(139,92,246,.28),transparent 70%),radial-gradient(50% 35% at 0% 25%,rgba(236,72,153,.16),transparent 70%),radial-gradient(60% 40% at 50% 110%,rgba(56,189,248,.12),transparent 70%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;font-size:16px;color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus{border-color:rgba(139,92,246,.7);background:rgba(139,92,246,.08)}
input[type=date]{min-height:48px;text-align:right}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{font-weight:900;font-size:24px;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
.brand i{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--a1),var(--a2));display:grid;place-items:center;font-style:normal;font-size:16px;box-shadow:0 6px 20px rgba(139,92,246,.45)}
.msw{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.msw b{font-size:14px;font-weight:700;padding:0 8px;min-width:96px;text-align:center}
.msw button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--card2);font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.hero{position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(139,92,246,.35),rgba(236,72,153,.18) 60%,rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.12);padding:20px}
.hero::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;left:-60px;top:-70px;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%)}
.lbl{font-size:12px;color:var(--mute);font-weight:500}
.hero .lbl{color:rgba(255,255,255,.75)}
.big{font-size:34px;font-weight:900;letter-spacing:-1px;margin:4px 0 2px;line-height:1.2}
.big small{font-size:14px;font-weight:500;opacity:.7;margin-right:4px}
.seg{display:flex;height:10px;border-radius:99px;overflow:hidden;margin:16px 0 14px;background:rgba(255,255,255,.08);gap:2px}
.seg span{height:100%;transition:width .5s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(0,0,0,.18);border-radius:14px;padding:10px}
.stat b{display:block;font-size:14px;font-weight:800;margin-top:3px}
.acts{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;margin:14px 0 6px}
.btn{height:52px;border-radius:16px;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.p{background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 10px 26px rgba(139,92,246,.4)}
.btn.s{background:var(--card2);border:1px solid var(--line)}
.btn.d{background:rgba(251,113,133,.12);color:var(--bad);border:1px solid rgba(251,113,133,.25)}
.btn.w{width:100%}
h3{font-size:16px;font-weight:800;margin:22px 4px 10px;display:flex;justify-content:space-between;align-items:center}
h3 small{font-size:12px;color:var(--mute);font-weight:500}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bk{position:relative;overflow:hidden;padding:14px;border-radius:20px;background:var(--card);border:1px solid var(--line);text-align:right;transition:transform .12s}
.bk:active{transform:scale(.97)}
.bk::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 100% 0%,var(--c),transparent 60%);opacity:.18}
.bk .em{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--c) 22%,transparent);margin-bottom:10px;position:relative}
.bk .nm{font-size:13px;font-weight:700;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .am{font-size:17px;font-weight:900;margin:4px 0 2px;position:relative}
.bk .sub{font-size:11px;color:var(--mute);position:relative}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:10px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c);transition:width .5s}
.bar.over i{background:var(--bad)}
.tag{position:absolute;left:12px;top:12px;font-size:10px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--mute)}
.list{display:flex;flex-direction:column;gap:2px;padding:6px}
.row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px}
.row:active{background:var(--card2)}
.row .em{width:40px;height:40px;flex:none;border-radius:13px;display:grid;place-items:center;font-size:19px;background:rgba(255,255,255,.07)}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mid span{font-size:12px;color:var(--mute)}
.row .amt{font-weight:800;font-size:14px;white-space:nowrap}
.plus{color:var(--good)}.minus{color:var(--text)}
.empty{text-align:center;color:var(--mute);font-size:13px;padding:22px 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;transition:all .15s}
.chip.on{background:color-mix(in srgb,var(--c,#8b5cf6) 28%,transparent);border-color:var(--c,#8b5cf6)}
.rec{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.rec::-webkit-scrollbar{display:none}
.rc{flex:none;min-width:132px;padding:12px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:right}
.rc .ck{width:22px;height:22px;border-radius:8px;border:2px solid rgba(255,255,255,.25);display:grid;place-items:center;font-size:12px;margin-bottom:8px}
.rc.on{border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.1)}
.rc.on .ck{background:var(--good);border-color:var(--good);color:#06281d}
.rc b{display:block;font-size:13px}.rc span{font-size:12px;color:var(--mute)}
.field{margin-bottom:14px}.field>.lbl{display:block;margin:0 4px 6px}
.amtin{font-size:30px;font-weight:900;text-align:center;padding:16px;border-radius:20px;letter-spacing:-.5px}
.hint{text-align:center;font-size:13px;color:var(--a2);min-height:20px;margin-top:6px;font-weight:600}
.sp{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;position:relative;overflow:hidden}
.sp::before{content:"";position:absolute;right:0;top:0;bottom:0;width:4px;background:var(--c)}
.sp .em{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--c) 20%,transparent);flex:none}
.sp .mid{flex:1;min-width:0}.sp .mid b{font-size:14px;display:block}.sp .mid span{font-size:11px;color:var(--mute)}
.sp .v{font-weight:900;font-size:15px;text-align:left}
.cp{width:36px;height:36px;border-radius:11px;background:var(--card2);display:grid;place-items:center;flex:none}
.cp svg{width:17px;height:17px}
.tgl{width:36px;height:36px;border-radius:11px;border:2px solid rgba(255,255,255,.2);display:grid;place-items:center;flex:none;font-size:15px}
.tgl.on{background:var(--good);border-color:var(--good);color:#06281d}
.sp.done{opacity:.55}
.inc{margin-bottom:10px;padding:0;overflow:hidden}
.inc>.row{padding:14px}
.inc .body{padding:0 12px 6px}
.prog{font-size:11px;color:var(--mute)}
.tabs{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);height:66px;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(20,18,32,.72);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid rgba(255,255,255,.1);border-radius:24px;z-index:20;box-shadow:0 20px 40px rgba(0,0,0,.45)}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--mute);font-weight:600}
.tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:#fff}
.tabs button.on svg{stroke:url(#gr);filter:drop-shadow(0 2px 8px rgba(236,72,153,.6))}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#15131f;border-radius:28px 28px 0 0;border-top:1px solid rgba(255,255,255,.12);padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:90vh;overflow-y:auto;transform:translateY(105%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.9,.3,1),visibility 0s .32s}
.sheet.on{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.9,.3,1)}
.grab{width:40px;height:5px;border-radius:9px;background:rgba(255,255,255,.2);margin:0 auto 14px}
.sheet h2{font-size:19px;font-weight:900;margin-bottom:16px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-140%);background:rgba(30,28,44,.95);border:1px solid rgba(255,255,255,.12);padding:11px 18px;border-radius:99px;font-size:13px;font-weight:700;z-index:90;transition:transform .3s;white-space:nowrap;backdrop-filter:blur(10px)}
.toast.on{transform:translate(-50%,0)}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.kpi .card b{display:block;font-size:19px;font-weight:900;margin-top:4px}
.chart{width:100%;height:auto;display:block}
.leg{display:flex;gap:14px;font-size:11px;color:var(--mute);margin-top:8px}
.leg i{display:inline-block;width:10px;height:3px;border-radius:3px;margin-left:5px;vertical-align:middle}
.pe{padding:14px;margin-bottom:10px}
.pe .h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pe .h input.e{width:52px;text-align:center;font-size:20px;padding:8px}
.pe .h input.n{font-weight:700}
.pct{display:flex;align-items:center;gap:10px}
.pct b{min-width:52px;text-align:center;font-size:18px;font-weight:900}
.pct button{width:36px;height:36px;border-radius:12px;background:var(--card2);font-size:20px;flex:none}
input[type=range]{flex:1;padding:0;height:6px;border-radius:9px;background:rgba(255,255,255,.12);border:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.total{position:sticky;top:calc(env(safe-area-inset-top) + 6px);z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-radius:18px;margin-bottom:12px;background:rgba(20,18,32,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);font-weight:800}
.total.ok b{color:var(--good)}.total.no b{color:var(--bad)}
.x{width:36px;height:36px;border-radius:12px;background:rgba(251,113,133,.12);color:var(--bad);flex:none;font-size:18px}
.seg2{display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.06);border-radius:12px;padding:3px;gap:3px}
.seg2 button{padding:8px 4px;border-radius:9px;font-size:12px;font-weight:700;color:var(--mute)}
.seg2 button.on{background:var(--card2);color:#fff}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.jd{display:grid;grid-template-columns:auto 1fr 1.6fr 1.3fr;gap:6px;align-items:center;margin-bottom:14px}.jd .lbl{padding:0 4px}.jd select{text-align:center;text-align-last:center;padding:12px 6px}
.goal{font-size:11px;color:var(--mute);margin-top:4px;position:relative}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs></svg>
<main id="view"></main>
<nav class="tabs" id="tabs">
  <button data-a="tab" data-v="plan"><svg viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>برنامه</button>
  <button data-a="tab" data-v="invest"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>سرمایه</button>
  <button data-a="tab" data-v="split"><svg viewBox="0 0 24 24"><path d="M12 3v9h9a9 9 0 1 1-9-9z"/><path d="M15.5 3.7A9 9 0 0 1 20.3 8.5H15.5z"/></svg>تقسیم</button>
  <button data-a="tab" data-v="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>خانه</button>
</nav>
<div class="ov" id="ov" data-a="close"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<input type="file" id="imp" accept="application/json,.json" style="display:none">

<script>
/* ============ Utils ============ */
const KEY='jib-v1';
const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const fa=(n,d=0)=>Number(n||0).toLocaleString('fa-IR',{maximumFractionDigits:d});
const toEn=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const parseAmt=s=>+toEn(s).replace(/[^\d]/g,'')||0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function short(n){n=Math.abs(n);if(n>=1e9)return fa(n/1e9,2)+' میلیارد';if(n>=1e6)return fa(n/1e6,1)+' میلیون';if(n>=1e3)return fa(n/1e3,0)+' هزار';return fa(n)}
const T=n=>fa(n)+' <small>تومان</small>';
const jfmt=new Intl.DateTimeFormat('en-US-u-ca-persian',{year:'numeric',month:'numeric',day:'numeric'});
function jParts(ts){const p={};jfmt.formatToParts(new Date(ts)).forEach(x=>p[x.type]=x.value);return{y:+toEn(p.year).replace(/\D/g,''),m:+toEn(p.month),d:+toEn(p.day)}}
const mKey=ts=>{const p=jParts(ts);return p.y+'-'+pad(p.m)};
const mLabel=k=>{const[y,m]=k.split('-');return MONTHS[+m-1]+' '+fa(+y).replace(/٬/g,'')};
const mShort=k=>MONTHS[+k.split('-')[1]-1].slice(0,3);
const mNext=(k,s=1)=>{let[y,m]=k.split('-').map(Number);m+=s;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+'-'+pad(m)};
const dLabel=ts=>{const p=jParts(ts);return fa(p.d)+' '+MONTHS[p.m-1]};
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const tsToIso=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const div=(a,b)=>~~(a/b),mod=(a,b)=>a-~~(a/b)*b;
const JB=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
function jalCal(jy){let gy=jy+621,leapJ=-14,jp=JB[0],jm,jump=0,n,i;
  for(i=1;i<JB.length;i++){jm=JB[i];jump=jm-jp;if(jy<jm)break;leapJ+=div(jump,33)*8+div(mod(jump,33),4);jp=jm}
  n=jy-jp;leapJ+=div(n,33)*8+div(mod(n,33)+3,4);if(mod(jump,33)===4&&jump-n===4)leapJ++;
  const leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150,march=20+leapJ-leapG;
  if(jump-n<6)n=n-jump+div(jump+4,33)*33;let leap=mod(mod(n+1,33)-1,4);if(leap===-1)leap=4;return{leap,gy,march}}
function g2d(gy,gm,gd){let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;return d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752}
function d2g(n){let j=4*n+139361631;j=j+div(div(4*n+183187720,146097)*3,4)*4-3908;const i=div(mod(j,1461),4)*5+308,gd=div(mod(i,153),5)+1,gm=mod(div(i,153),12)+1;return{gy:div(j,1461)-100100+div(8-gm,6),gm,gd}}
function jToIso(jy,jm,jd){const r=jalCal(jy),g=d2g(g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1);return g.gy+'-'+pad(g.gm)+'-'+pad(g.gd)}
const jLen=(y,m)=>m<=6?31:m<=11?30:(jalCal(y).leap===0?30:29);
function dateField(k,iso){const p=jParts(new Date(iso+'T12:00:00').getTime()),cy=jParts(Date.now()).y,n=jLen(p.y,p.m);
  const opt=(v,l,sel)=>`<option value="${v}" ${v===sel?'selected':''}>${l}</option>`;
  let d='',m='',y='';for(let i=1;i<=n;i++)d+=opt(i,fa(i),p.d);MONTHS.forEach((x,i)=>m+=opt(i+1,x,p.m));for(let i=cy-3;i<=cy+1;i++)y+=opt(i,fa(i).replace(/٬/g,''),p.y);
  return `<div class="jd" data-k="${k}"><span class="lbl">تاریخ</span><select data-in="jd" data-p="d">${d}</select><select data-in="jd" data-p="m">${m}</select><select data-in="jd" data-p="y">${y}</select></div>`}
const isoToTs=v=>{if(!v||v===todayISO())return Date.now();return new Date(v+'T12:00:00').getTime()};

/* ============ Default plan ============ */
function defaults(){
  const b=(id,name,emoji,pct,color,type,cats,fixed=0)=>({id,name,emoji,pct,color,type,card:'',goal:0,cats,fixed});
  return{
    v:2,
    buckets:[
      b('ess','هزینه‌های جاری','🛒',20,'#f59e0b','spend',['سوپرمارکت','بنزین و حمل‌ونقل','قبوض و اینترنت','خانه','رستوران و کافه','دارو و درمان','سایر']),
      b('inv','سرمایه‌گذاری','📈',25,'#22c55e','invest',[]),
      b('sav','پس‌انداز و اضطراری','🛡️',15,'#38bdf8','save',[]),
      b('ptr','پول توجیبی پارتنر','💝',10,'#f472b6','spend',['پول توجیبی','سایر']),

/* ============ Calculations ============ */
const B=id=>S.buckets.find(b=>b.id===id);
const inM=(ts,k)=>mKey(ts)===k;
const incM=k=>S.incomes.filter(i=>inM(i.ts,k));
const expM=k=>S.expenses.filter(e=>inM(e.ts,k));
const allocM=(bid,k)=>incM(k).reduce((s,i)=>s+(i.alloc[bid]||0),0);
const spentM=(bid,k)=>expM(k).filter(e=>e.bucketId===bid).reduce((s,e)=>s+e.amount,0);
const balAll=bid=>S.incomes.reduce((s,i)=>s+(i.alloc[bid]||0),0)-S.expenses.filter(e=>e.bucketId===bid).reduce((s,e)=>s+e.amount,0);
const totPct=()=>S.buckets.filter(b=>!b.fixed).reduce((s,b)=>s+(+b.pct||0),0);
function split(amount,ts=Date.now()){
  const res={},k=mKey(ts);let rest=amount;
  S.buckets.filter(b=>b.fixed>0).forEach(b=>{const need=Math.max(0,b.fixed-allocM(b.id,k)),v=Math.min(need,rest);if(v>0){res[b.id]=v;rest-=v}});
  const bs=S.buckets.filter(b=>!b.fixed&&b.pct>0),tot=bs.reduce((s,b)=>s+ +b.pct,0)||1;let used=0;
  bs.forEach(b=>{const v=Math.floor(rest*b.pct/tot/1000)*1000;res[b.id]=v;used+=v});
  if(bs.length){const big=bs.reduce((a,b)=>+b.pct>+a.pct?b:a);res[big.id]+=rest-used}
  return res;
}

  <div class="two"><input inputmode="numeric" placeholder="مبلغ ماهانه" value="${r.amount?fa(r.amount):''}" data-in="r" data-id="${r.id}" data-f="amount"><select data-in="r" data-id="${r.id}" data-f="bucketId">${S.buckets.map(b=>`<option value="${b.id}" ${b.id===r.bucketId?'selected':''}>${b.emoji} ${esc(b.name)}</option>`).join('')}</select></div></div>`).join('');
  return `<div class="top"><div class="brand"><i>👛</i>برنامه تقسیم</div></div>
  <div class="total ${tp===100?'ok':'no'}" id="tot"><span>جمع درصدها</span><b>${fa(tp)}٪ ${tp===100?'✓':''}</b></div>
  ${bs}
  <div class="two" style="margin-bottom:6px"><button class="btn s" data-a="addb">＋ جیب جدید</button><button class="btn s" data-a="resetplan">برنامهٔ پیشنهادی</button></div>
  <h3>پرداخت‌های ثابت ماهانه <small>هر ماه از نو تیک می‌خورن</small></h3>
  ${rec}<button class="btn s w" data-a="addr">＋ پرداخت ثابت</button>
  <h3>تنظیمات و پشتیبان</h3>
  <div class="card"><div class="row" data-a="rial" style="padding:6px"><div class="mid"><b>کپی مبلغ به ریال</b><span>برای چسباندن در اپ بانک</span></div><div class="tgl ${S.settings.copyRial?'on':''}">${S.settings.copyRial?'✓':''}</div></div>
  <div class="two"><button class="btn s" data-a="export">⬇︎ خروجی پشتیبان</button><button class="btn s" data-a="import">⬆︎ بازیابی</button></div>
  <button class="btn d w" style="margin-top:10px" data-a="wipe">پاک کردن همه اطلاعات</button></div>
  <p class="lbl" style="text-align:center;margin-top:16px">اطلاعات فقط روی همین گوشی ذخیره میشه • ماهی یک بار پشتیبان بگیر</p>`;
}

/* ============ Sheet ============ */
function sheetExp(){
  const s=UI.sheet,b=B(s.bucketId)||S.buckets[0];if(!s.bucketId&&b)s.bucketId=b.id;
  const order=[...S.buckets.filter(x=>x.type==='spend'),...S.buckets.filter(x=>x.type!=='spend')];
  return `<div class="grab"></div><h2>${s.editId?'ویرایش':'ثبت'} ${b&&b.type!=='spend'?'برداشت':'هزینه'}</h2>
  <div class="field"><input class="amtin" id="ex-amt" inputmode="numeric" placeholder="۰" value="${s.amount?fa(s.amount):''}" data-in="examt"><div class="hint" id="ex-hint">${s.amount?short(s.amount)+' تومان':'مبلغ به تومان'}</div></div>
  <div class="field"><span class="lbl">از کدوم جیب؟</span><div class="chips">${order.map(x=>`<button class="chip ${x.id===s.bucketId?'on':''}" style="--c:${x.color}" data-a="exb" data-v="${x.id}">${x.emoji} ${esc(x.name)}</button>`).join('')}</div></div>
  ${b&&b.cats&&b.cats.length?`<div class="field"><span class="lbl">دسته</span><div class="chips">${b.cats.map(c=>`<button class="chip ${s.cat===c?'on':''}" style="--c:${b.color}" data-a="excat" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div></div>`:''}
  <input style="margin-bottom:8px" placeholder="توضیح (اختیاری)" value="${esc(s.note||'')}" data-in="exnote">${dateField('ex',s.date||todayISO())}
  <button class="btn p w" data-a="saveexp">${s.editId?'ذخیره تغییرات':'ثبت'}</button>
  ${s.editId?`<button class="btn d w" style="margin-top:10px" data-a="delexp" data-v="${s.editId}">حذف این هزینه</button>`:''}`;
}
function sheetInc(){
  const s=UI.sheet;
  return `<div class="grab"></div><h2>ویرایش درآمد</h2>
  <div class="field"><input class="amtin" id="ex-amt" inputmode="numeric" placeholder="۰" value="${s.amount?fa(s.amount):''}" data-in="examt"><div class="hint" id="ex-hint">${s.amount?short(s.amount)+' تومان':'مبلغ به تومان'}</div></div>
  <input style="margin-bottom:8px" placeholder="منبع" value="${esc(s.source||'')}" data-in="insrc">${dateField('ex',s.date)}
  <div class="lbl" style="margin:0 4px 16px">اگه مبلغ یا تاریخ رو عوض کنی، دوباره بین جیب‌ها تقسیم میشه و تیک‌های انتقالش از نو شروع میشن.</div>
  <button class="btn p w" data-a="saveinc">ذخیره تغییرات</button>
  <button class="btn d w" style="margin-top:10px" data-a="delinc" data-v="${s.editId}">حذف این درآمد</button>`;
}
const sheetHTML=()=>UI.sheet.kind==='inc'?sheetInc():sheetExp();
function openSheet(s){UI.sheet=s;$('#sheet').innerHTML=sheetHTML();$('#ov').classList.add('on');$('#sheet').classList.add('on');setTimeout(()=>{const i=$('#ex-amt');i&&i.focus()},300)}
function closeSheet(){UI.sheet=null;$('#ov').classList.remove('on');$('#sheet').classList.remove('on');document.activeElement&&document.activeElement.blur()}

/* ============ Render ============ */
function render(){
  const v={home:vHome,split:vSplit,invest:vInvest,plan:vPlan}[UI.tab];
  $('#view').innerHTML=v();
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===UI.tab));
}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800)}
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(10)}catch(e){}};

/* ============ Actions ============ */
const A={
  tab:v=>{UI.tab=v;render();window.scrollTo({top:0})},
  mon:v=>{UI.month=mNext(UI.month,+v);render()},
  close:closeSheet,
  addexp:v=>openSheet({bucketId:v||null,amount:0,cat:'',note:'',date:todayISO()}),
  exb:v=>{UI.sheet.bucketId=v;UI.sheet.cat='';$('#sheet').innerHTML=sheetHTML()},
  excat:v=>{UI.sheet.cat=UI.sheet.cat===v?'':v;$('#sheet').innerHTML=sheetHTML()},
  saveexp:()=>{const s=UI.sheet;if(!s.amount)return toast('مبلغ رو وارد کن');
    if(s.editId){const e=S.expenses.find(x=>x.id===s.editId);const keep=tsToIso(e.ts)===s.date;Object.assign(e,{bucketId:s.bucketId,amount:s.amount,cat:s.cat,note:s.note||'',ts:keep?e.ts:isoToTs(s.date)})}
    else S.expenses.push({id:uid(),bucketId:s.bucketId,amount:s.amount,cat:s.cat,note:s.note||'',ts:isoToTs(s.date)});
    save();closeSheet();buzz();toast(s.editId?'ویرایش شد ✓':'ثبت شد ✓');UI.month=mKey(isoToTs(s.date));render()},
  dosplit:()=>{const s=UI.split;if(!s.amount)return toast('مبلغ رو وارد کن');
    const ts=isoToTs(s.date),inc={id:uid(),amount:s.amount,source:s.source,ts,alloc:split(s.amount,ts),done:{}};
    S.incomes.push(inc);save();UI.split={amount:0,source:'',date:todayISO()};UI.open=inc.id;UI.month=mKey(ts);buzz();toast('تقسیم شد! حالا به کارت‌ها منتقل کن 💸');render()},
  editexp:v=>{const e=S.expenses.find(x=>x.id===v);if(!e)return;openSheet({editId:v,bucketId:e.bucketId,amount:e.amount,cat:e.cat||'',note:e.note||'',date:tsToIso(e.ts)})},
  editinc:v=>{const i=S.incomes.find(x=>x.id===v);if(!i)return;openSheet({kind:'inc',editId:v,amount:i.amount,source:i.source||'',date:tsToIso(i.ts)})},
  saveinc:()=>{const s=UI.sheet,i=S.incomes.find(x=>x.id===s.editId);if(!s.amount)return toast('مبلغ رو وارد کن');
    const ts=tsToIso(i.ts)===s.date?i.ts:isoToTs(s.date);i.source=s.source;
    if(s.amount!==i.amount||ts!==i.ts){S.incomes=S.incomes.filter(x=>x!==i);i.amount=s.amount;i.ts=ts;i.alloc=split(s.amount,ts);i.done={};S.incomes.push(i)}
    save();closeSheet();buzz();toast('ویرایش شد ✓');UI.month=mKey(i.ts);render()},
  openinc:v=>{UI.open=UI.open===v?null:v;render()},
  done:v=>{const[iid,bid]=v.split('|');const i=S.incomes.find(x=>x.id===iid);i.done=i.done||{};i.done[bid]=!i.done[bid];save();buzz();render()},
  copy:v=>{const n=+v*(S.settings.copyRial?10:1);const txt=String(n);
    const ok=()=>toast('کپی شد: '+fa(n)+(S.settings.copyRial?' ریال':' تومان'));
    if(navigator.clipboard)navigator.clipboard.writeText(txt).then(ok,()=>fallbackCopy(txt,ok));else fallbackCopy(txt,ok)},
  delinc:v=>{if(!confirm('این درآمد و تقسیمش حذف بشه؟'))return;S.incomes=S.incomes.filter(i=>i.id!==v);save();closeSheet();render()},
  delexp:v=>{if(!confirm('این هزینه حذف بشه؟'))return;S.expenses=S.expenses.filter(e=>e.id!==v);Object.values(S.paid).forEach(p=>{for(const r in p)if(p[r]===v)delete p[r]});save();closeSheet();render()},
  rec:v=>{const k=UI.month,r=S.recurring.find(x=>x.id===v);S.paid[k]=S.paid[k]||{};const p=S.paid[k];
    if(p[v]){S.expenses=S.expenses.filter(e=>e.id!==p[v]);delete p[v]}
    else{let amt=r.amount;if(!amt){const x=prompt('مبلغ «'+r.name+'» (تومان):');amt=parseAmt(x||'');if(!amt)return;r.amount=amt}
      const[y,m]=k.split('-');const ts=mKey(Date.now())===k?Date.now():tsOfMonth(k);
      const id=uid();S.expenses.push({id,bucketId:r.bucketId,amount:amt,cat:r.name,note:'',ts});p[v]=id}
    save();buzz();render()},
  setval:()=>{const n=parseAmt($('#iv').value);if(!n)return toast('ارزش رو وارد کن');S.invVals.push({id:uid(),value:n,ts:Date.now()});save();toast('ثبت شد ✓');render()},
  delval:v=>{if(!confirm('حذف بشه؟'))return;S.invVals=S.invVals.filter(x=>x.id!==v);save();render()},
  pct:v=>{const[id,d]=v.split('|');const b=B(id);b.pct=Math.max(0,Math.min(100,(+b.pct)+(+d)));save();render()},
  bmode:v=>{const[id,m]=v.split('|');const b=B(id);if(m==='fixed'){b.fixed=b.fixed||1000000;b.pct=0}else{b.fixed=0}save();render()},
  btype:v=>{const[id,t]=v.split('|');B(id).type=t;save();render()},
  delb:v=>{const b=B(v);if(!confirm('جیب «'+b.name+'» حذف بشه؟'))return;S.buckets=S.buckets.filter(x=>x.id!==v);save();render()},
  addb:()=>{const cols=['#e879f9','#facc15','#4ade80','#f87171','#818cf8','#22d3ee'];S.buckets.push({id:uid(),name:'جیب جدید',emoji:'⭐️',pct:0,color:cols[S.buckets.length%cols.length],type:'spend',card:'',goal:0,cats:['سایر']});save();render();window.scrollTo({top:document.body.scrollHeight/2})},
  resetplan:()=>{if(!confirm('درصدها و جیب‌ها به برنامهٔ پیشنهادی برگردن؟ (تراکنش‌ها می‌مونن)'))return;const d=defaults();
    d.buckets.forEach(nb=>{const ob=B(nb.id);if(ob){nb.card=ob.card;nb.goal=ob.goal}});S.buckets=d.buckets;save();render()},
  addr:()=>{S.recurring.push({id:uid(),name:'پرداخت جدید',amount:0,bucketId:S.buckets[0]?.id});save();render()},
  delr:v=>{S.recurring=S.recurring.filter(r=>r.id!==v);save();render()},
  rial:()=>{S.settings.copyRial=!S.settings.copyRial;save();render()},
  export:async()=>{const data=JSON.stringify(S,null,1),name='jib-backup-'+mKey(Date.now())+'.json';
    try{const f=new File([data],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'پشتیبان جیب'});return}}catch(e){if(e.name==='AbortError')return}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;a.click()},
  import:()=>$('#imp').click(),
  wipe:()=>{if(!confirm('همه چیز پاک بشه؟ این کار برگشت نداره.'))return;if(!confirm('مطمئنی؟ اول پشتیبان گرفتی؟'))return;S=defaults();save();render()}
};
function tsOfMonth(k){// a timestamp inside jalali month k (search ±40 days around approx)
  let t=Date.now();for(let i=0;i<800;i++){const mk=mKey(t);if(mk===k)return t;t+=(mk<k?1:-1)*86400000*(Math.abs(i)<1?1:3)}return Date.now()}
function fallbackCopy(t,ok){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(e){toast(t)}ta.remove()}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f)f(el.dataset.v)});
document.addEventListener('input',e=>{
  const el=e.target,k=el.dataset.in;if(!k)return;
  const fmtAmt=()=>{const n=parseAmt(el.value);el.value=n?fa(n):'';return n};
  if(k==='spamt'){UI.split.amount=fmtAmt();$('#sp-hint').textContent=UI.split.amount?short(UI.split.amount)+' تومان':'مبلغ به تومان';$('#sp-prev').innerHTML=previewHTML()}
  else if(k==='spsrc')UI.split.source=el.value;
  else if(k==='spdate')UI.split.date=el.value;
  else if(k==='examt'){UI.sheet.amount=fmtAmt();$('#ex-hint').textContent=UI.sheet.amount?short(UI.sheet.amount)+' تومان':'مبلغ به تومان'}
  else if(k==='exnote')UI.sheet.note=el.value;
  else if(k==='insrc')UI.sheet.source=el.value;
  else if(k==='jd'){const g=el.closest('.jd'),v=q=>+g.querySelector(`[data-p=${q}]`).value,y=v('y'),m=v('m'),d=Math.min(v('d'),jLen(y,m)),iso=jToIso(y,m,d);
    if(g.dataset.k==='sp')UI.split.date=iso;else UI.sheet.date=iso;
    if(el.dataset.p!=='d')g.outerHTML=dateField(g.dataset.k,iso)}
  else if(k==='exdate')UI.sheet.date=el.value;
  else if(k==='fmt')fmtAmt();
  else if(k==='b'){const b=B(el.dataset.id),f=el.dataset.f;
    if(f==='pct'){b.pct=+el.value;$('#p-'+b.id).textContent=fa(b.pct)+'٪';const tp=totPct(),t=$('#tot');t.className='total '+(tp===100?'ok':'no');t.querySelector('b').textContent=fa(tp)+'٪ '+(tp===100?'✓':'')}
    else if(f==='goal')b.goal=fmtAmt();
    else if(f==='fixed')b.fixed=fmtAmt();
    else if(f==='cats')b.cats=el.value.split(/[،,]/).map(s=>s.trim()).filter(Boolean);
    else b[f]=el.value;
    save()}
  else if(k==='r'){const r=S.recurring.find(x=>x.id===el.dataset.id),f=el.dataset.f;r[f]=f==='amount'?fmtAmt():el.value;save()}
});
document.addEventListener('change',e=>{if(e.target.dataset.in==='r'&&e.target.dataset.f==='bucketId'){S.recurring.find(x=>x.id===e.target.dataset.id).bucketId=e.target.value;save()}});
$('#imp').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.buckets)throw 0;if(!confirm('اطلاعات فعلی با پشتیبان جایگزین بشه؟'))return;S=d;save();load();render();toast('بازیابی شد ✓')}catch(x){toast('فایل پشتیبان معتبر نیست')}};r.readAsText(f);e.target.value=''});

function deepLink(){
  const q=new URLSearchParams(location.search||location.hash.slice(1)),name=(q.get('add')||'').trim();
  if(!q.has('add'))return;
  history.replaceState(null,'',location.pathname);
  let amt=parseAmt(q.get('amt')||'');const k=parseFloat(toEn(q.get('k')||'').replace(/[^\d.]/g,''));if(!amt&&k)amt=Math.round(k*1000);
  const sig=name+'|'+amt,last=JSON.parse(localStorage.getItem('jib-link')||'{}');
  if(last.sig===sig&&Date.now()-last.t<15000)return;localStorage.setItem('jib-link',JSON.stringify({sig,t:Date.now()}));
  let b=S.buckets.find(x=>x.name===name),cat='';
  if(!b){b=S.buckets.find(x=>(x.cats||[]).includes(name));cat=name}
  if(!b){b=B('ess')||S.buckets[0];cat=name}
  UI.tab='home';UI.month=mKey(Date.now());
  if(!amt){render();openSheet({bucketId:b.id,amount:0,cat,note:'',date:todayISO()});return}
  S.expenses.push({id:uid(),bucketId:b.id,amount:amt,cat,note:q.get('note')||'',ts:Date.now()});save();render();buzz();
  setTimeout(()=>toast('✓ ثبت شد: '+(cat||b.name)+' • '+short(amt)+' تومان'),300);
}
render();deepLink();
window.addEventListener('pageshow',e=>{if(e.persisted)deepLink()});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol==='https:'&&window.top===window.self)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
